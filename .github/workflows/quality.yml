name: Project quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - name: Run calculation and file regression tests
        run: npm test
      - name: Check funding period design fixtures
        run: npm run check:funding-period-design
      - name: Check walkthrough, evidence and source compatibility
        run: |
          node tools/build-import-walkthrough.mjs --check
          node tools/check-capability-evidence.mjs
          node tools/check-fee-source-compatibility.mjs
          node tools/check-fee-semantic-budget.mjs
          node tools/check-fee-semantic-integration.mjs
          node tools/check-fee-capacity-stages.mjs
          node tools/check-fee-save-guidance.mjs
          node tools/check-fee-layered-capture.mjs
          node tools/check-fee-layered-source-mapping.mjs
          node tools/check-fee-browser-recovery-design.mjs
          node tools/check-fee-browser-native.mjs
          node tools/check-fee-recovery-format.mjs
          node tools/check-fee-recovery-sharing.mjs
      - name: Check container cost review design fixtures
        run: npm run check:container-review-design
      - name: Check fee tax component design fixtures
        run: node tools/check-fee-tax-components-design.mjs
      - name: Check fee tax attachment lifecycle design
        run: node tools/check-fee-tax-attachment-design.mjs
      - name: Check fee precision and adjustment design
        run: node tools/check-fee-precision-design.mjs
      - name: Check fee precision selection lifecycle design
        run: node tools/check-fee-precision-selection-design.mjs
      - name: Check fee application transaction design
        run: node tools/check-fee-application-design.mjs
      - name: Check fee envelope and history design
        run: node tools/check-fee-envelope-design.mjs
      - name: Audit UI bindings and engine codes
        run: npm run audit
      - name: Typecheck and build offline deliverable
        run: npm run build:single
      - name: Verify tracked deliverable matches source
        run: git diff --exit-code -- trade-cost-engine.html
      - name: Rebuild project schemas and templates
        run: npm run build:catalog
      - name: Verify tracked schemas and templates match source
        run: git diff --exit-code -- schemas/ templates/
      - name: Retain reviewed build
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ runner.os }}-${{ github.sha }}
          path: |
            trade-cost-engine.html
            dist/
            schemas/
            templates/
            docs/project-format.md
            docs/project-migration.md
          if-no-files-found: error
          retention-days: 14
