name: Project quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Run calculation and file regression tests
        run: npm test
      - name: Audit UI bindings and engine codes
        run: npm run audit
      - name: Typecheck and build offline deliverable
        run: npm run build:single
      - name: Verify tracked deliverable matches source
        run: git diff --exit-code -- trade-cost-engine.html
      - name: Retain reviewed build
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ runner.os }}-${{ github.sha }}
          path: |
            trade-cost-engine.html
            dist/
          if-no-files-found: error
          retention-days: 14
